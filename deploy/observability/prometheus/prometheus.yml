# Prometheus config for the compose observability overlay.
# In Kubernetes use a ServiceMonitor / PodMonitor (kube-prometheus-stack) instead; the
# rule file below can be loaded as a PrometheusRule unchanged (spec.groups).
global:
  scrape_interval: 15s
  evaluation_interval: 30s
  external_labels:
    env: local

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: xdata-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          service: api
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
