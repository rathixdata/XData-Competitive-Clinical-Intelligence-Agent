# Secrets are synced from AWS Secrets Manager by external-secrets.io (ESO >= 0.16).
# Nothing secret is stored in git. The Secrets Manager secret is a JSON object whose keys
# become env vars:
#   XDATA_DATABASE_URL            postgresql+psycopg://xdata:<pw>@<rds-endpoint>:5432/xdata?sslmode=require
#   XDATA_REDIS_URL               rediss://:<auth-token>@<elasticache-endpoint>:6379/0
#   XDATA_JWT_SECRET              >= 32 random bytes          (mandatory in production)
#   XDATA_FIELD_ENCRYPTION_KEY    Fernet key                  (mandatory in production)
#   XDATA_WEBHOOK_SIGNING_SECRET  >= 32 random bytes          (mandatory in production)
#   XDATA_ANTHROPIC_API_KEY, XDATA_VOYAGE_API_KEY, XDATA_NCBI_API_KEY,
#   XDATA_OPENFDA_API_KEY, XDATA_SMTP_USERNAME, XDATA_SMTP_PASSWORD
#   PG_BACKUP_URL                 postgresql://xdata_backup:<pw>@<rds-endpoint>:5432/xdata?sslmode=require
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: xdata
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: xdata-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: xdata-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: xdata/production/app   # patched per overlay
