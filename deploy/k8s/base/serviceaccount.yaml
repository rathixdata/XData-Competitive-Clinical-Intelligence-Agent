# Workload identity for api / worker / beat / backup / external-secrets.
# The IRSA role (deploy/terraform/aws: aws_iam_role.app_irsa) grants S3 (raw bucket +
# backups) and read access to this environment's Secrets Manager secrets. Overlays set the
# real role ARN.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xdata
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/xdata-app-irsa  # patched per overlay
automountServiceAccountToken: false
---
# The web (nginx) pods need no cloud or API access at all.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: xdata-web
automountServiceAccountToken: false
