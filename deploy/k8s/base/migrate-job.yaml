# Database migrations, run BEFORE new app pods roll out.
#  * Argo CD: PreSync hook (recreated on every sync).
#  * Plain kubectl (.github/workflows/deploy.yml): the workflow deletes the previous Job,
#    applies this one alone, waits for completion, then applies the rest.
# Migrations must be backward compatible with the currently running release
# (expand -> migrate -> contract) so a failed rollout can be rolled back without a
# schema downgrade.
apiVersion: batch/v1
kind: Job
metadata:
  name: xdata-migrate
  labels:
    app.kubernetes.io/name: xdata
    app.kubernetes.io/component: migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: xdata
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: xdata
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: xdata-ci-backend
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: xdata-config
            - secretRef:
                name: xdata-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
