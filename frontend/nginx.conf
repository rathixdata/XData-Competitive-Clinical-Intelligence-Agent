# XData CI Agent - nginx server block for the SPA.
# Rendered by the nginx image's envsubst entrypoint (templates/*.template), so the API
# upstream (env XDATA_API_UPSTREAM_HOST, host:port, default api:8000) can be set per
# environment. Only variables defined in the environment are substituted, so nginx runtime
# variables like $host stay untouched as long as no env var shares the name.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/javascript
           application/xml image/svg+xml application/manifest+json;

server_tokens off;

# Hashed Vite assets can be cached "forever"; everything else revalidates.
map $uri $xdata_cache_control {
    ~^/assets/          "public, max-age=31536000, immutable";
    default             "no-cache";
}

upstream xdata_api {
    server ${XDATA_API_UPSTREAM_HOST};
    keepalive 16;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # ---- security headers (repeated in locations that set their own add_header) ----
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: TLS terminates at the ingress / load balancer in staging+prod. Enable there
    # (or uncomment here if this nginx ever terminates TLS itself):
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- SSE: streaming answers. No buffering, long read timeout. ----
    location = /api/v1/ask/stream {
        proxy_pass http://xdata_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        add_header X-Accel-Buffering "no" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://xdata_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass http://xdata_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        access_log off;
    }

    # Hashed build output.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control $xdata_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # SPA fallback: any unknown path serves index.html (never cached).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control $xdata_cache_control always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
