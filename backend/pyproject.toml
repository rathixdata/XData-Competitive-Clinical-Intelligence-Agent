[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xdata-ci-agent"
version = "1.0.0"
description = "XData Competitive & Clinical Intelligence Agent - evidence-grounded life-sciences competitive intelligence"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pgvector>=0.3",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "anthropic>=1.8",
  "httpx>=0.27",
  "tenacity>=8.5",
  "celery>=5.4",
  "redis>=5.0",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "pyjwt[crypto]>=2.9",
  "argon2-cffi>=23.1",
  "cryptography>=43",
  "rapidfuzz>=3.9",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "fpdf2>=2.7",
  "boto3>=1.34",
  "python-dateutil>=2.9",
  "croniter>=2.0",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.9",
  "defusedxml>=0.7",
  "email-validator>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "respx>=0.21", "ruff>=0.6", "mypy>=1.11"]
otel = [
  "opentelemetry-sdk>=1.26",
  "opentelemetry-exporter-otlp>=1.26",
  "opentelemetry-instrumentation-fastapi>=0.47b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.47b0",
  "opentelemetry-instrumentation-celery>=0.47b0",
]

[project.scripts]
xdata = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.ai.prompts" = ["*.md"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101", "B008", "S311", "E501", "B904", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"alembic/*" = ["E", "F"]
# Illustrative demo fixtures; the demo password is documented and only used for local/pilot demos.
"app/seed/*" = ["C408", "S105", "S107"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
